<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RePic · Креаторы промтов</title>
<meta name="description" content="Анкеты и референсы персон креаторов сообщества RePic — промты для генерации ИИ-картинок.">
<link rel="icon" href="assets/logo.png">
<meta property="og:title" content="RePic · Креаторы промтов">
<meta property="og:description" content="Анкеты и референсы персон креаторов сообщества RePic">
<meta property="og:image" content="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#1b0f3d; --bg2:#2a1364; --bg3:#3b1a86;
  --glow:#8b5cff; --glow2:#00d9ff;
  --ice:#dff1ff; --ice2:#b9e4ff;
  --pink:#ffb3e6; --text:#f2ecff; --muted:#bfb0e8;
  --card:rgba(255,255,255,.06); --stroke:rgba(190,170,255,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--text);
  background:var(--bg1); overflow-x:hidden; min-height:100vh;
}
/* ── фон ── */
.bg{position:fixed;inset:0;z-index:-3;
  background:
   radial-gradient(1200px 800px at 15% 10%, #4a1fa8 0%, transparent 60%),
   radial-gradient(1000px 700px at 85% 25%, #1e63b8 0%, transparent 55%),
   radial-gradient(900px 900px at 50% 110%, #6b2fb5 0%, transparent 60%),
   linear-gradient(160deg,#170c35,#2a1364 55%,#1a0f42);
  background-size:200% 200%; animation:drift 24s ease-in-out infinite;
}
@keyframes drift{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.42;z-index:-2;mix-blend-mode:screen}
.b1{width:420px;height:420px;background:#7a3cff;top:-80px;left:-60px;animation:float1 18s ease-in-out infinite}
.b2{width:380px;height:380px;background:#22c6ff;bottom:-100px;right:-60px;animation:float2 22s ease-in-out infinite}
.b3{width:300px;height:300px;background:#ff7ad9;top:45%;left:60%;animation:float1 26s ease-in-out infinite reverse}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,80px) scale(1.15)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,-60px) scale(1.2)}}
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none}
.star{position:absolute;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:.95;transform:scale(1.25)}}

/* ── шапка ── */
header{position:relative;text-align:center;padding:110px 20px 70px;max-width:900px;margin:0 auto}
.logo-wrap{position:relative;display:inline-block;margin-bottom:26px}
.logo{width:170px;height:170px;border-radius:38px;display:block;
  filter:drop-shadow(0 0 40px rgba(139,92,255,.85));
  animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-16px) rotate(2deg)}}
.halo{position:absolute;inset:-30px;border-radius:50%;
  background:radial-gradient(circle,rgba(140,110,255,.55),transparent 65%);
  animation:pulse 4s ease-in-out infinite;z-index:-1}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.5}50%{transform:scale(1.25);opacity:.95}}
h1{font-family:'Comfortaa',cursive;font-size:clamp(2.6rem,9vw,4.6rem);font-weight:700;letter-spacing:1px;
  background:linear-gradient(100deg,#ffffff,#b9e4ff,#d9b8ff,#ffb3e6,#ffffff);
  background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 7s linear infinite;filter:drop-shadow(0 0 22px rgba(160,120,255,.5))}
@keyframes shine{to{background-position:300% center}}
.tagline{color:var(--muted);font-size:clamp(1rem,3.4vw,1.2rem);margin:16px auto 30px;max-width:560px;line-height:1.7}
.tg-btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-weight:800;
  padding:15px 34px;border-radius:999px;font-size:1.05rem;position:relative;
  background:linear-gradient(120deg,#7c3aff,#3ba9ff,#b66cff);background-size:200% auto;
  box-shadow:0 10px 34px rgba(110,60,255,.55);transition:.35s;animation:shine 5s linear infinite}
.tg-btn:hover{transform:translateY(-4px) scale(1.05);box-shadow:0 16px 46px rgba(140,90,255,.8)}
.tg-btn svg{width:22px;height:22px;fill:#fff}

/* ── карточки ── */
.section-title{text-align:center;font-family:'Comfortaa',cursive;font-size:clamp(1.7rem,6vw,2.6rem);
  margin:40px 0 10px;color:#fff;text-shadow:0 0 26px rgba(150,110,255,.7)}
.section-sub{text-align:center;color:var(--muted);margin-bottom:54px;font-size:1rem}
.grid{max-width:1180px;margin:0 auto;padding:0 20px 90px;
  display:grid;gap:36px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.card{position:relative;border-radius:30px;padding:2px;
  background:linear-gradient(140deg,rgba(185,228,255,.6),rgba(180,120,255,.35),rgba(255,179,230,.5));
  opacity:0;transform:translateY(50px);transition:.8s cubic-bezier(.2,.8,.25,1)}
.card.in{opacity:1;transform:none}
.card-in{background:linear-gradient(170deg,rgba(40,20,90,.85),rgba(25,14,60,.92));
  border-radius:28px;overflow:hidden;backdrop-filter:blur(14px);height:100%;
  display:flex;flex-direction:column;transition:.4s}
.card:hover .card-in{transform:translateY(-10px)}
.card:hover{filter:drop-shadow(0 22px 50px rgba(130,80,255,.55))}
.ph{position:relative;aspect-ratio:3/4;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top center;
  transition:transform .9s cubic-bezier(.2,.8,.25,1);display:block}
.card:hover .ph img{transform:scale(1.08)}
.ph::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(25,14,60,.95) 2%,rgba(25,14,60,.15) 40%,transparent 70%)}
.sheen{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);
  transform:translateX(-120%);transition:transform .9s}
.card:hover .sheen{transform:translateX(120%)}
.name{position:absolute;left:22px;bottom:16px;z-index:3;font-family:'Comfortaa',cursive;
  font-size:1.55rem;font-weight:700;text-shadow:0 2px 18px rgba(0,0,0,.8)}
.name small{display:block;font-family:'Nunito';font-size:.82rem;font-weight:600;color:var(--ice2);opacity:.9;margin-top:3px}
.body{padding:22px 24px 26px;display:flex;flex-direction:column;gap:14px;flex:1}
.rows{display:flex;flex-direction:column;gap:9px}
.row{display:flex;gap:10px;font-size:.94rem;line-height:1.5}
.k{color:var(--ice2);font-weight:800;min-width:74px;opacity:.85}
.v{color:#efe8ff}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.tag{font-size:.76rem;padding:5px 12px;border-radius:999px;font-weight:700;
  background:rgba(160,120,255,.18);border:1px solid var(--stroke);color:#dcd0ff}
.link{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;
  text-decoration:none;color:#fff;font-weight:800;padding:13px;border-radius:16px;font-size:.95rem;
  background:linear-gradient(120deg,rgba(124,58,255,.85),rgba(59,169,255,.85));
  border:1px solid rgba(255,255,255,.18);transition:.3s}
.link:hover{transform:scale(1.04);box-shadow:0 8px 26px rgba(120,70,255,.6)}
.link svg{width:17px;height:17px;fill:#fff}

/* ── подвал ── */
footer{text-align:center;padding:60px 20px 80px;border-top:1px solid rgba(190,170,255,.18);
  color:var(--muted);font-size:.92rem;line-height:1.9}
footer a{color:var(--ice2);text-decoration:none;font-weight:700}
footer a:hover{color:#fff}
.spark{display:inline-block;animation:sp 3s ease-in-out infinite}
@keyframes sp{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.35) rotate(18deg)}}
@media(max-width:600px){header{padding:70px 18px 40px}.logo{width:130px;height:130px}}
</style>
</head>
<body>
<div class="bg"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div id="stars"></div>

<header>
  <div class="logo-wrap"><div class="halo"></div><img class="logo" src="assets/logo.png" alt="RePic"></div>
  <h1>RePic</h1>
  <p class="tagline">Сообщество, где рождаются промты для ИИ-картинок ✦ Здесь живут анкеты и референсы наших персон-креаторов</p>
  <a class="tg-btn" href="https://t.me/repicprompts" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24"><path d="M9.8 16.3l-.4 4.6c.6 0 .8-.2 1.1-.5l2.6-2.5 5.4 4c1 .5 1.7.3 2-.9l3.5-16.5c.3-1.4-.5-2-1.5-1.6L1.3 9.6C-.1 10.1 0 11 1.1 11.3l5.5 1.7L19.4 5.4c.6-.4 1.2-.2.7.2z"/></svg>
    Наш Telegram-канал
  </a>
</header>

<h2 class="section-title">✧ Наши креаторы ✧</h2>
<p class="section-sub">Нажми на карточку, чтобы заглянуть в гости</p>

<div class="grid" id="grid"></div>

<footer>
  <span class="spark">✦</span> Сделано с любовью для сообщества <a href="https://t.me/repicprompts" target="_blank" rel="noopener">RePic</a> <span class="spark">✦</span><br>
  © 2026 RePic · промты, референсы и немного магии
</footer>

<script>
/* звёздочки */
const sky=document.getElementById('stars');
for(let i=0;i<110;i++){const s=document.createElement('div');s.className='star';
 const z=Math.random()*2.2+.8;s.style.cssText=`width:${z}px;height:${z}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s`;
 sky.appendChild(s);}

/* данные креаторов */
const creators=[
 {n:'Милка',t:'Пикми Милка',img:'assets/milka.jpg',url:'https://t.me/milkagrobgrob',
  rows:[['Персона','Пикми Милка'],['Вайб','мягкий сумеречный уют'],['Палитра','ночной индиго + мятный блик']],
  tags:['#аниме','#портреты','#уют','#ночь']},
 {n:'Ева',t:'Слоппи',img:'assets/eva.jpg',url:'https://t.me/sloppyhouse',
  rows:[['Персона','Ева — Слоппи'],['Вайб','розовая нежность и кружево'],['Палитра','сахарный розовый + белый лайн']],
  tags:['#розовое','#хайдетейл','#тату','#dollcore']},
 {n:'Фаина',t:'Невлада',img:'assets/faina.jpg',url:'https://t.me/nivladish',
  rows:[['Персона','Фаина — Невлада'],['Вайб','альт-реализм с характером'],['Палитра','винный красный + бирюза']],
  tags:['#реализм','#альт','#пирсинг','#стиль']},
 {n:'Женя',t:'Вену',img:'assets/zhenya.jpg',url:'https://t.me/venuprompts',
  rows:[['Персона','Женя — Вену'],['Вайб','тёплое солнце и веснушки'],['Палитра','огненный рыжий + золото полей']],
  tags:['#аниме','#тепло','#веснушки','#лето']}
];

const tg='<svg viewBox="0 0 24 24"><path d="M9.8 16.3l-.4 4.6c.6 0 .8-.2 1.1-.5l2.6-2.5 5.4 4c1 .5 1.7.3 2-.9l3.5-16.5c.3-1.4-.5-2-1.5-1.6L1.3 9.6C-.1 10.1 0 11 1.1 11.3l5.5 1.7L19.4 5.4c.6-.4 1.2-.2.7.2z"/></svg>';
document.getElementById('grid').innerHTML=creators.map((c,i)=>`
<div class="card" style="transition-delay:${i*110}ms">
 <div class="card-in">
  <div class="ph"><img src="${c.img}" alt="${c.n}" loading="lazy"><div class="sheen"></div>
   <div class="name">${c.n}<small>${c.t}</small></div></div>
  <div class="body">
   <div class="rows">${c.rows.map(r=>`<div class="row"><span class="k">${r[0]}</span><span class="v">${r[1]}</span></div>`).join('')}</div>
   <div class="tags">${c.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
   <a class="link" href="${c.url}" target="_blank" rel="noopener">${tg} Перейти в канал</a>
  </div>
 </div>
</div>`).join('');

/* появление при скролле */
const io=new IntersectionObserver(e=>e.forEach(x=>x.isIntersecting&&x.target.classList.add('in')),{threshold:.12});
document.querySelectorAll('.card').forEach(c=>io.observe(c));

/* лёгкий 3D-наклон */
document.querySelectorAll('.card').forEach(card=>{
 const inner=card.querySelector('.card-in');
 card.addEventListener('mousemove',e=>{const r=card.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
  inner.style.transform=`translateY(-10px) rotateY(${x*9}deg) rotateX(${-y*9}deg)`;});
 card.addEventListener('mouseleave',()=>inner.style.transform='');
});
</script>
</body>
</html>
