<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RePic · Креаторы промтов</title>
<meta name="description" content="Референсы персон креаторов сообщества RePic — промты для генерации ИИ-картинок.">
<link rel="icon" href="assets/logo.png">
<meta property="og:title" content="RePic · Креаторы промтов">
<meta property="og:image" content="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --glow:#8b5cff; --ice:#dff1ff; --ice2:#b9e4ff; --pink:#ffb3e6;
  --text:#f6f1ff; --muted:#c9bcf0; --stroke:rgba(200,180,255,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--text);background:#180d3a;overflow-x:hidden}

/* ── фон ── */
.bg{position:fixed;inset:0;z-index:-4;
  background:
   radial-gradient(1200px 800px at 15% 8%, #4f22b0 0%, transparent 60%),
   radial-gradient(1000px 700px at 85% 22%, #1f6ac4 0%, transparent 55%),
   radial-gradient(900px 900px at 50% 108%, #7a34c4 0%, transparent 60%),
   linear-gradient(160deg,#170c35,#2b1468 55%,#1a0f42);
  background-size:200% 200%;animation:drift 24s ease-in-out infinite}
@keyframes drift{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
.blob{position:fixed;border-radius:50%;filter:blur(95px);opacity:.42;z-index:-3;mix-blend-mode:screen}
.b1{width:440px;height:440px;background:#7a3cff;top:-90px;left:-70px;animation:f1 18s ease-in-out infinite}
.b2{width:400px;height:400px;background:#22c6ff;bottom:-110px;right:-70px;animation:f2 22s ease-in-out infinite}
.b3{width:320px;height:320px;background:#ff7ad9;top:45%;left:62%;animation:f1 26s ease-in-out infinite reverse}
@keyframes f1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,80px) scale(1.15)}}
@keyframes f2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,-60px) scale(1.2)}}
#stars,#doodles{position:fixed;inset:0;pointer-events:none}
#stars{z-index:-2}#doodles{z-index:-1}
.star{position:absolute;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12;transform:scale(.5)}50%{opacity:1;transform:scale(1.3)}}
.doodle{position:absolute;opacity:.5;will-change:transform}
.doodle svg{display:block;overflow:visible}
@keyframes floatUp{
  0%{transform:translateY(0) rotate(0deg);opacity:0}
  12%{opacity:.65}
  88%{opacity:.5}
  100%{transform:translateY(-118vh) rotate(var(--spin));opacity:0}}
@keyframes sway{0%,100%{margin-left:0}50%{margin-left:var(--sw)}}

/* ── шапка ── */
header{position:relative;text-align:center;padding:100px 20px 40px;max-width:940px;margin:0 auto}
.logo-wrap{position:relative;display:inline-block;margin-bottom:24px}
.logo{width:168px;height:168px;border-radius:38px;display:block;
  filter:drop-shadow(0 0 40px rgba(139,92,255,.85));animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-16px) rotate(2deg)}}
.halo{position:absolute;inset:-32px;border-radius:50%;z-index:-1;
  background:radial-gradient(circle,rgba(150,115,255,.6),transparent 65%);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.5}50%{transform:scale(1.28);opacity:.95}}
/* сердечки вокруг логотипа */
.orbit{position:absolute;inset:-46px;animation:spin 22s linear infinite;pointer-events:none}
.orbit svg{position:absolute;width:26px;height:26px;animation:spin 22s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-family:'Comfortaa',cursive;font-size:clamp(2.7rem,9vw,4.8rem);font-weight:700;letter-spacing:1px;
  background:linear-gradient(100deg,#fff,#b9e4ff,#d9b8ff,#ffb3e6,#fff);background-size:300% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 7s linear infinite;filter:drop-shadow(0 0 22px rgba(160,120,255,.55))}
@keyframes shine{to{background-position:300% center}}
.tagline{color:var(--muted);font-size:clamp(1rem,3.4vw,1.15rem);margin:14px auto 0;max-width:520px;line-height:1.7}

/* ── стрелка + кнопка тг ── */
.tg-zone{position:relative;display:inline-block;margin:44px auto 0;padding-top:8px}
.arrow{position:absolute;left:-118px;top:-26px;width:110px;color:var(--pink);
  animation:point 2.6s ease-in-out infinite;pointer-events:none}
.arrow .cap{position:absolute;left:4px;top:-30px;transform:rotate(-13deg);
  font-family:'Comfortaa',cursive;font-size:.95rem;color:#ffd0f2;white-space:nowrap;
  text-shadow:0 0 14px rgba(255,140,220,.7)}
@keyframes point{0%,100%{transform:translate(0,0)}50%{transform:translate(12px,6px)}}
.arrow svg{width:110px;height:auto;stroke:currentColor;fill:none;
  stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 10px rgba(255,140,220,.8))}
.tg-btn{display:inline-flex;align-items:center;gap:11px;text-decoration:none;color:#fff;font-weight:900;
  padding:17px 40px;border-radius:999px;font-size:1.08rem;position:relative;z-index:2;
  background:linear-gradient(120deg,#7c3aff,#3ba9ff,#ff6fd2,#7c3aff);background-size:300% auto;
  box-shadow:0 12px 38px rgba(120,60,255,.6);transition:.35s;animation:shine 6s linear infinite}
.tg-btn:hover{transform:translateY(-5px) scale(1.06);box-shadow:0 18px 52px rgba(150,90,255,.85)}
.tg-btn svg{width:23px;height:23px;fill:#fff}

/* ── заголовок секции ── */
.section-title{text-align:center;font-family:'Comfortaa',cursive;font-size:clamp(1.8rem,6vw,2.7rem);
  margin:86px 0 46px;color:#fff;text-shadow:0 0 28px rgba(160,115,255,.75)}
.section-title i{font-style:normal;display:inline-block;animation:sp 3s ease-in-out infinite}
@keyframes sp{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.35) rotate(18deg)}}

/* ── карточки ── */
.grid{max-width:1200px;margin:0 auto;padding:0 20px 60px;
  display:grid;gap:40px;grid-template-columns:repeat(auto-fit,minmax(285px,1fr))}
.card{position:relative;border-radius:34px;padding:2px;
  background:linear-gradient(140deg,rgba(185,228,255,.65),rgba(190,130,255,.4),rgba(255,179,230,.6));
  opacity:0;transform:translateY(55px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.25,1)}
.card.in{opacity:1;transform:none}
.card::before{content:"";position:absolute;inset:-3px;border-radius:36px;z-index:-1;opacity:0;
  background:linear-gradient(140deg,#b9e4ff,#c07bff,#ff9ae0);filter:blur(16px);transition:opacity .4s}
.card:hover::before{opacity:.85}
.card-in{background:linear-gradient(170deg,rgba(45,22,100,.9),rgba(26,14,62,.95));
  border-radius:32px;overflow:hidden;backdrop-filter:blur(14px);height:100%;
  display:flex;flex-direction:column;transition:transform .4s}
.card:hover .card-in{transform:translateY(-10px)}
.ph{position:relative;aspect-ratio:3/4;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;
  transition:transform .9s cubic-bezier(.2,.8,.25,1)}
.card:hover .ph img{transform:scale(1.07)}
.ph::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(26,14,62,.96) 1%,rgba(26,14,62,.1) 38%,transparent 66%)}
.sheen{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.34) 50%,transparent 65%);
  transform:translateX(-120%);transition:transform .95s}
.card:hover .sheen{transform:translateX(120%)}
.badge{position:absolute;top:15px;right:15px;z-index:3;width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid var(--stroke);
  backdrop-filter:blur(6px);animation:bob 4.5s ease-in-out infinite}
.badge svg{width:19px;height:19px}

.body{padding:24px 24px 26px;display:flex;flex-direction:column;gap:18px;flex:1}
.names{display:flex;flex-direction:column;gap:12px}
.nrow{display:flex;flex-direction:column;gap:3px}
.lbl{font-size:.72rem;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#a99ddb}
.val{font-family:'Comfortaa',cursive;font-size:1.45rem;font-weight:700;color:#fff;
  text-shadow:0 0 18px rgba(170,130,255,.45)}
.val.p{background:linear-gradient(95deg,#ffd6f5,#b9e4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--stroke),transparent)}

.btns{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;color:#fff;
  font-weight:800;padding:14px;border-radius:18px;font-size:.96rem;border:1px solid rgba(255,255,255,.2);
  transition:.3s;position:relative;overflow:hidden}
.btn svg{width:18px;height:18px;fill:#fff}
.dl{background:linear-gradient(120deg,#ff5fbf,#a24bff,#4aa8ff);background-size:220% auto;
  box-shadow:0 8px 26px rgba(200,70,190,.4);animation:shine 6s linear infinite}
.dl:hover{transform:scale(1.045);box-shadow:0 12px 34px rgba(220,80,200,.7)}
.dl svg{animation:down 1.8s ease-in-out infinite}
@keyframes down{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.tgl{background:rgba(255,255,255,.08)}
.tgl:hover{background:rgba(255,255,255,.17);transform:scale(1.045)}

footer{text-align:center;padding:50px 20px 90px;border-top:1px solid rgba(190,170,255,.16);
  color:var(--muted);font-size:.93rem;line-height:2}
footer a{color:var(--ice2);text-decoration:none;font-weight:800}
footer a:hover{color:#fff}
footer .hearts{font-size:1.3rem;letter-spacing:8px}
footer .hearts span{display:inline-block;animation:sp 3s ease-in-out infinite}
@media(max-width:700px){
  header{padding:66px 18px 26px}.logo{width:132px;height:132px}
  .arrow{left:50%;top:-86px;transform:translateX(-50%) rotate(74deg);width:78px;animation:none}
  .arrow svg{width:78px}.arrow .cap{left:-30px;top:64px;transform:rotate(-74deg)}
  .tg-zone{margin-top:74px}
  .section-title{margin:64px 0 36px}
}
</style>
</head>
<body>
<div class="bg"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div id="stars"></div><div id="doodles"></div>

<header>
  <div class="logo-wrap">
    <div class="halo"></div>
    <div class="orbit" id="orbit"></div>
    <img class="logo" src="assets/logo.png" alt="RePic">
  </div>
  <h1>RePic</h1>
  <p class="tagline">Сообщество, где рождаются промты для ИИ-картинок ✧ референсы наших персон-креаторов</p>

  <div class="tg-zone">
    <div class="arrow">
      <span class="cap">нам сюда! ♡</span>
      <svg viewBox="0 0 120 70">
        <path d="M4 12 C30 2, 66 6, 88 26 C98 35, 104 45, 108 56"/>
        <path d="M92 48 L109 58 L104 39"/>
      </svg>
    </div>
    <a class="tg-btn" href="https://t.me/repicprompts" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M9.8 16.3l-.4 4.6c.6 0 .8-.2 1.1-.5l2.6-2.5 5.4 4c1 .5 1.7.3 2-.9l3.5-16.5c.3-1.4-.5-2-1.5-1.6L1.3 9.6C-.1 10.1 0 11 1.1 11.3l5.5 1.7L19.4 5.4c.6-.4 1.2-.2.7.2z"/></svg>
      Наш Telegram-канал
    </a>
  </div>
</header>

<h2 class="section-title"><i>✧</i> Наши креаторы <i>✧</i></h2>
<div class="grid" id="grid"></div>

<footer>
  <div class="hearts"><span>♡</span><span style="animation-delay:.4s">✦</span><span style="animation-delay:.8s">♡</span></div>
  Сделано с любовью для сообщества <a href="https://t.me/repicprompts" target="_blank" rel="noopener">RePic</a><br>
  © 2026 RePic · промты, референсы и немного магии
</footer>

<script>
/* ── звёздочки ── */
const sky=document.getElementById('stars');
for(let i=0;i<150;i++){const s=document.createElement('div');s.className='star';
 const z=Math.random()*2.4+.7;
 s.style.cssText=`width:${z}px;height:${z}px;left:${Math.random()*100}%;top:${Math.random()*100}%;`+
   `animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s;`+
   `background:${['#fff','#ffd6f5','#b9e4ff','#e3d0ff'][i%4]}`;
 sky.appendChild(s);}

/* ── рисованные от руки летающие символы ── */
const S='stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="2.4"';
const shapes=[
 /* сердечко */`<svg viewBox="0 0 30 28"><path ${S} d="M15 25C15 25 2 17.5 2 9.6 2 5.4 5.3 2.5 8.7 2.5c2.6 0 4.9 1.7 6.3 4 1.4-2.3 3.7-4 6.3-4C24.7 2.5 28 5.4 28 9.6 28 17.5 15 25 15 25z"/></svg>`,
 /* четырёхлучевая звезда как в лого */`<svg viewBox="0 0 30 30"><path ${S} d="M15 1.5c1.2 7.5 5.8 12.1 13.3 13.5-7.5 1.4-12.1 6-13.3 13.5C13.8 21 9.2 16.4 1.7 15 9.2 13.6 13.8 9 15 1.5z"/></svg>`,
 /* искорка */`<svg viewBox="0 0 26 26"><path ${S} d="M13 2v22M2 13h22M5.5 5.5l15 15M20.5 5.5l-15 15"/></svg>`,
 /* цветочек */`<svg viewBox="0 0 30 30"><path ${S} d="M15 4c3 0 4.5 2.4 4.5 5S18 14 15 14s-4.5-2.4-4.5-5S12 4 15 4z"/><path ${S} d="M15 16c3 0 4.5 2.4 4.5 5S18 26 15 26s-4.5-2.4-4.5-5 1.5-5 4.5-5z"/><path ${S} d="M9.5 10.5c2.1 2.1 1.8 4.9 0 6.7s-4.6 2.1-6.7 0"/><path ${S} d="M20.5 10.5c-2.1 2.1-1.8 4.9 0 6.7s4.6 2.1 6.7 0"/></svg>`,
 /* бантик */`<svg viewBox="0 0 34 24"><path ${S} d="M17 12c-4-5-9-8-12-6s-2 9 1 10 8-1 11-4z"/><path ${S} d="M17 12c4-5 9-8 12-6s2 9-1 10-8-1-11-4z"/><circle ${S} cx="17" cy="12" r="2.4"/></svg>`,
 /* облачко */`<svg viewBox="0 0 36 22"><path ${S} d="M9 19h18c4 0 6-2.6 6-5.6S30.6 8 27 8c-.6-3.7-3.6-6-7-6-3.8 0-6.8 2.7-7.4 6.3C8.6 8.6 6 11 6 14.2 6 17 7.3 19 9 19z"/></svg>`,
 /* месяц */`<svg viewBox="0 0 26 26"><path ${S} d="M21 16.5A10 10 0 0 1 9 4.6a10.4 10.4 0 1 0 12 11.9z"/></svg>`,
 /* капелька-блик */`<svg viewBox="0 0 22 28"><path ${S} d="M11 2c4.5 6 8 10 8 14.6A8 8 0 1 1 3 16.6C3 12 6.5 8 11 2z"/></svg>`
];
const cols=['#ffb3e6','#b9e4ff','#d9b8ff','#fff0a8','#a8ffe8','#ffc9de'];
const dz=document.getElementById('doodles');
function spawnDoodle(seedTop){
  const d=document.createElement('div');d.className='doodle';
  const size=Math.random()*26+16, dur=Math.random()*16+18;
  d.innerHTML=shapes[Math.floor(Math.random()*shapes.length)];
  const svg=d.firstChild;svg.setAttribute('width',size);svg.setAttribute('height',size);
  svg.querySelectorAll('[stroke-width],circle,path').forEach(p=>p.setAttribute('stroke',cols[Math.floor(Math.random()*cols.length)]));
  d.style.cssText=`left:${Math.random()*96}%;top:${seedTop?Math.random()*120:105}%;`+
    `--spin:${(Math.random()*2-1)*260}deg;--sw:${(Math.random()*2-1)*60}px;`+
    `animation:floatUp ${dur}s linear ${seedTop?-Math.random()*dur:0}s infinite, sway ${dur/3}s ease-in-out infinite;`+
    `filter:drop-shadow(0 0 8px rgba(255,180,255,.55))`;
  dz.appendChild(d);
  setTimeout(()=>d.remove(),(dur+2)*1000);
}
for(let i=0;i<26;i++) spawnDoodle(true);
setInterval(()=>spawnDoodle(false),1400);

/* сердечки на орбите логотипа */
const orb=document.getElementById('orbit');
['♡','✦','♡','✧'].forEach((ch,i)=>{
  const e=document.createElement('div');
  e.textContent=ch;
  e.style.cssText=`position:absolute;font-size:20px;color:${cols[i]};left:50%;top:50%;`+
    `transform:rotate(${i*90}deg) translateY(-118px);text-shadow:0 0 12px currentColor`;
  orb.appendChild(e);
});

/* ── креаторы ── */
const creators=[
 {p:'Милка', c:'Милка',  f:'milka',  url:'https://t.me/milkagrobgrob'},
 {p:'Ева',   c:'Слоппи', f:'eva',    url:'https://t.me/sloppyhouse'},
 {p:'Фаина', c:'Невлада',f:'faina',  url:'https://t.me/nivladish'},
 {p:'Женя',  c:'Вену',   f:'zhenya', url:'https://t.me/venuprompts'}
];
const tg='<svg viewBox="0 0 24 24"><path d="M9.8 16.3l-.4 4.6c.6 0 .8-.2 1.1-.5l2.6-2.5 5.4 4c1 .5 1.7.3 2-.9l3.5-16.5c.3-1.4-.5-2-1.5-1.6L1.3 9.6C-.1 10.1 0 11 1.1 11.3l5.5 1.7L19.4 5.4c.6-.4 1.2-.2.7.2z"/></svg>';
const dl='<svg viewBox="0 0 24 24"><path d="M12 3a1.4 1.4 0 0 1 1.4 1.4v8.7l2.9-2.9a1.4 1.4 0 1 1 2 2l-5.3 5.3a1.4 1.4 0 0 1-2 0L5.7 12.2a1.4 1.4 0 0 1 2-2l2.9 2.9V4.4A1.4 1.4 0 0 1 12 3zM4.4 18.2a1.4 1.4 0 0 1 1.4 1.4h12.4a1.4 1.4 0 1 1 0 2.8H5.8a2.8 2.8 0 0 1-2.8-2.8 1.4 1.4 0 0 1 1.4-1.4z"/></svg>';
const heart='<svg viewBox="0 0 30 28"><path fill="#ffb3e6" d="M15 25S2 17.5 2 9.6C2 5.4 5.3 2.5 8.7 2.5c2.6 0 4.9 1.7 6.3 4 1.4-2.3 3.7-4 6.3-4C24.7 2.5 28 5.4 28 9.6 28 17.5 15 25 15 25z"/></svg>';

document.getElementById('grid').innerHTML=creators.map((c,i)=>`
<div class="card" style="transition-delay:${i*110}ms">
 <div class="card-in">
  <div class="ph">
   <img src="assets/${c.f}.jpg" alt="${c.p}" loading="lazy">
   <div class="sheen"></div><div class="badge">${heart}</div>
  </div>
  <div class="body">
   <div class="names">
    <div class="nrow"><span class="lbl">Имя персоны</span><span class="val p">${c.p}</span></div>
    <div class="divider"></div>
    <div class="nrow"><span class="lbl">Имя креатора</span><span class="val">${c.c}</span></div>
   </div>
   <div class="btns">
    <a class="btn dl" href="assets/${c.f}-full.jpg" download="RePic-${c.p}.jpg">${dl} Скачать в полном размере</a>
    <a class="btn tgl" href="${c.url}" target="_blank" rel="noopener">${tg} Telegram креатора</a>
   </div>
  </div>
 </div>
</div>`).join('');

/* появление при скролле */
const io=new IntersectionObserver(e=>e.forEach(x=>x.isIntersecting&&x.target.classList.add('in')),{threshold:.12});
document.querySelectorAll('.card').forEach(c=>io.observe(c));

/* 3D-наклон */
document.querySelectorAll('.card').forEach(card=>{
 const inner=card.querySelector('.card-in');
 card.addEventListener('mousemove',e=>{const r=card.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  inner.style.transform=`translateY(-10px) rotateY(${x*9}deg) rotateX(${-y*9}deg)`;});
 card.addEventListener('mouseleave',()=>inner.style.transform='');
});

/* сердечки по клику на кнопку скачивания */
document.querySelectorAll('.dl').forEach(b=>b.addEventListener('click',e=>{
 for(let i=0;i<9;i++){const h=document.createElement('div');
  h.textContent=['♡','✦','✧'][i%3];
  h.style.cssText=`position:fixed;left:${e.clientX}px;top:${e.clientY}px;pointer-events:none;z-index:99;`+
   `font-size:${12+Math.random()*14}px;color:${cols[i%cols.length]};text-shadow:0 0 10px currentColor;`+
   `transition:transform 1s cubic-bezier(.2,.8,.25,1),opacity 1s`;
  document.body.appendChild(h);
  requestAnimationFrame(()=>{h.style.transform=`translate(${(Math.random()-.5)*190}px,${-70-Math.random()*130}px) rotate(${(Math.random()-.5)*300}deg)`;h.style.opacity=0;});
  setTimeout(()=>h.remove(),1100);}
}));
</script>
</body>
</html>
