<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RePic · Креаторы промтов</title>
<meta name="description" content="Референсы персон креаторов сообщества RePic — промты для генерации ИИ-картинок.">
<link rel="icon" href="assets/logo.png">
<meta property="og:title" content="RePic · Креаторы промтов">
<meta property="og:image" content="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Comfortaa:wght@400;600;700&family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ice2:#b9e4ff; --pink:#ffb3e6; --text:#f6f1ff; --muted:#c9bcf0;
  --stroke:rgba(200,180,255,.35); --hand:'Caveat',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--text);background:#180d3a;overflow-x:hidden}

/* ── фон ── */
.bg{position:fixed;inset:0;z-index:-4;
  background:
   radial-gradient(1200px 800px at 15% 8%, #4f22b0 0%, transparent 60%),
   radial-gradient(1000px 700px at 85% 22%, #1f6ac4 0%, transparent 55%),
   radial-gradient(900px 900px at 50% 108%, #7a34c4 0%, transparent 60%),
   linear-gradient(160deg,#170c35,#2b1468 55%,#1a0f42);
  background-size:190% 190%;animation:drift 48s ease-in-out infinite}
@keyframes drift{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
.blob{position:fixed;border-radius:50%;filter:blur(95px);opacity:.42;z-index:-3;mix-blend-mode:screen}
.b1{width:440px;height:440px;background:#7a3cff;top:-90px;left:-70px;animation:f1 34s ease-in-out infinite}
.b2{width:400px;height:400px;background:#22c6ff;bottom:-110px;right:-70px;animation:f2 40s ease-in-out infinite}
.b3{width:320px;height:320px;background:#ff7ad9;top:45%;left:62%;animation:f1 46s ease-in-out infinite reverse}
@keyframes f1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,66px) scale(1.1)}}
@keyframes f2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-58px,-50px) scale(1.12)}}
#stars,#doodles{position:fixed;inset:0;pointer-events:none}
#stars{z-index:-2}#doodles{z-index:-1}
.star{position:absolute;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12;transform:scale(.5)}50%{opacity:1;transform:scale(1.3)}}
.doodle{position:absolute;opacity:.5;will-change:transform}
.doodle svg{display:block;overflow:visible}
@keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.65}88%{opacity:.5}
  100%{transform:translateY(-118vh) rotate(var(--spin));opacity:0}}
@keyframes sway{0%,100%{margin-left:0}50%{margin-left:var(--sw)}}

/* ── шапка ── */
header{position:relative;text-align:center;padding:100px 20px 40px;max-width:940px;margin:0 auto}
.logo-wrap{position:relative;display:inline-block;margin-bottom:24px}
.logo{width:168px;height:168px;border-radius:38px;display:block;
  filter:drop-shadow(0 0 40px rgba(139,92,255,.85));animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-16px) rotate(2deg)}}
.halo{position:absolute;inset:-32px;border-radius:50%;z-index:-1;
  background:radial-gradient(circle,rgba(150,115,255,.6),transparent 65%);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.5}50%{transform:scale(1.28);opacity:.95}}
.orbit{position:absolute;inset:-46px;animation:spin 22s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-family:'Comfortaa',cursive;font-size:clamp(2.7rem,9vw,4.8rem);font-weight:700;letter-spacing:1px;
  background:linear-gradient(100deg,#fff,#b9e4ff,#d9b8ff,#ffb3e6,#fff);background-size:300% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 9s linear infinite;filter:drop-shadow(0 0 22px rgba(160,120,255,.55))}
@keyframes shine{to{background-position:300% center}}
.tagline{color:var(--muted);font-size:clamp(1rem,3.4vw,1.15rem);margin:14px auto 0;max-width:520px;line-height:1.7}

/* ── стрелка (рисуется) + кнопка ── */
.tg-zone{position:relative;display:flex;flex-direction:column;align-items:center;margin:58px auto 0}
.arrow{width:210px;height:100px;margin-bottom:-6px;transform:translateX(-42px);pointer-events:none;position:relative}
.arrow svg{width:100%;height:100%;overflow:visible;
  fill:none;stroke:var(--pink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 9px rgba(255,140,220,.85))}
.arrow .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
  animation:draw 4.5s ease-in-out infinite}
.arrow .draw.tip{animation-name:drawTip}
@keyframes draw{
  0%{stroke-dashoffset:var(--len)} 40%{stroke-dashoffset:0}
  82%{stroke-dashoffset:0;opacity:1} 96%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes drawTip{
  0%,38%{stroke-dashoffset:var(--len)} 58%{stroke-dashoffset:0}
  82%{stroke-dashoffset:0;opacity:1} 96%,100%{stroke-dashoffset:0;opacity:0}}
.arrow .cap{position:absolute;left:0;top:4px;font-family:var(--hand);font-size:1.5rem;
  color:#ffd0f2;transform:rotate(-8deg);text-shadow:0 0 14px rgba(255,140,220,.75);
  animation:capFade 4.5s ease-in-out infinite;white-space:nowrap}
@keyframes capFade{0%,18%{opacity:0}42%,82%{opacity:1}96%,100%{opacity:0}}
.tg-btn{display:inline-flex;align-items:center;gap:11px;text-decoration:none;color:#fff;
  font-family:var(--hand);font-weight:700;font-size:1.72rem;letter-spacing:.5px;
  padding:13px 40px;border-radius:999px;position:relative;z-index:2;
  background:linear-gradient(120deg,#8b5cff,#5aa8ff,#c78bff,#8b5cff);background-size:300% auto;
  box-shadow:0 12px 38px rgba(120,60,255,.55);transition:.35s;animation:shine 14s linear infinite}
.tg-btn:hover{transform:translateY(-5px) scale(1.06);box-shadow:0 18px 52px rgba(150,90,255,.8)}
.tg-btn svg{width:23px;height:23px;fill:#fff}

.section-title{text-align:center;font-family:'Comfortaa',cursive;font-size:clamp(1.8rem,6vw,2.7rem);
  margin:86px 0 46px;color:#fff;text-shadow:0 0 28px rgba(160,115,255,.75)}
.section-title i{font-style:normal;display:inline-block;animation:sp 3s ease-in-out infinite}
@keyframes sp{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.3) rotate(16deg)}}

/* ── карточки с рисованной рамкой ── */
.grid{max-width:1200px;margin:0 auto;padding:0 20px 60px;
  display:grid;gap:44px;grid-template-columns:repeat(auto-fit,minmax(285px,1fr))}
.card{position:relative;opacity:0;transform:translateY(55px);
  transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.25,1)}
.card.in{opacity:1;transform:none}
.frame{position:absolute;inset:-3px;z-index:4;pointer-events:none}
.frame svg{width:100%;height:100%;fill:none;stroke:#ffc9ef;
  stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;
  filter:drop-shadow(0 0 6px rgba(255,170,235,.75));transition:stroke .4s}
.frame .l1{stroke-width:2.4}
.frame .l2{stroke-width:1.5;opacity:.6}
.card:hover .frame svg{stroke:#e0f0ff}
.card-in{background:linear-gradient(170deg,rgba(45,22,100,.9),rgba(26,14,62,.95));
  border-radius:26px;overflow:hidden;backdrop-filter:blur(14px);height:100%;isolation:isolate;
  display:flex;flex-direction:column;transition:transform .4s}
.card:hover .card-in{transform:translateY(-8px)}
.ph{position:relative;aspect-ratio:3/4;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;
  transition:transform .9s cubic-bezier(.2,.8,.25,1)}
.card:hover .ph img{transform:scale(1.06)}
.ph::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(26,14,62,.96) 1%,rgba(26,14,62,.1) 36%,transparent 62%)}
.sheen{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.sheen .band{position:absolute;top:-30%;left:-45%;width:46%;height:160%;
  display:flex;flex-direction:column;justify-content:space-around;align-items:center;
  transform:rotate(18deg) translateX(-140%);transition:transform 1.05s cubic-bezier(.3,.7,.35,1);
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.16),transparent)}
.card:hover .sheen .band{transform:rotate(18deg) translateX(300%)}
.sheen .band span{font-size:19px;line-height:1;color:#fff;
  text-shadow:0 0 12px rgba(255,190,240,.95),0 0 22px rgba(180,220,255,.8);
  transform:rotate(-18deg)}
.sheen .band span:nth-child(odd){color:#ffd6f2;font-size:15px}
.sheen .band span:nth-child(3n){color:#cfe8ff;font-size:22px}

.body{padding:24px 24px 26px;display:flex;flex-direction:column;gap:18px;flex:1}
.names{display:flex;flex-direction:column;gap:12px}
.nrow{display:flex;flex-direction:column;gap:3px}
.lbl{font-size:.72rem;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#a99ddb}
.val{font-family:'Comfortaa',cursive;font-size:1.45rem;font-weight:700;color:#fff;
  text-shadow:0 0 18px rgba(170,130,255,.45)}
.val.p{background:linear-gradient(95deg,#ffd6f5,#b9e4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--stroke),transparent)}

.btns{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;color:#fff;
  font-weight:800;padding:13px;border-radius:18px;font-size:.96rem;
  border:1px solid rgba(255,255,255,.2);transition:.3s;position:relative;overflow:hidden}
.btn svg{width:18px;height:18px;fill:#fff}
.dl{font-family:var(--hand);font-weight:700;font-size:1.42rem;letter-spacing:.4px;padding:11px 13px;
  background:linear-gradient(115deg,#e9b6ff,#b9c4ff,#a8e6ff,#ffc4ec,#e9b6ff);background-size:300% auto;
  color:#2a1150;border:1px solid rgba(255,255,255,.45);
  text-shadow:0 1px 0 rgba(255,255,255,.55);
  box-shadow:0 8px 24px rgba(180,140,255,.3);animation:shine 22s linear infinite}
.dl svg{fill:#4a2270;animation:down 2.6s ease-in-out infinite}
@keyframes down{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.dl:hover{transform:scale(1.035);box-shadow:0 12px 30px rgba(200,160,255,.55)}
.tgl{background:rgba(255,255,255,.08);font-family:var(--hand);font-weight:700;
  font-size:1.36rem;letter-spacing:.4px;padding:11px 13px}
.tgl:hover{background:rgba(255,255,255,.17);transform:scale(1.035)}

footer{text-align:center;padding:50px 20px 90px;border-top:1px solid rgba(190,170,255,.16);
  color:var(--muted);font-size:.93rem;line-height:2}
footer a{color:var(--ice2);text-decoration:none;font-family:var(--hand);
  font-weight:700;font-size:1.3rem}
footer .by{margin-top:6px;font-family:'Comfortaa',cursive;font-size:1.02rem;color:#ffb3e6}
footer .by a{font-family:'Comfortaa',cursive;font-weight:700;font-size:1.08rem;
  color:#ff9fe0;text-shadow:0 0 16px rgba(255,140,220,.7)}
footer .by a:hover{color:#ffd6f5}
footer a:hover{color:#fff}
footer .hearts{font-size:1.3rem;letter-spacing:8px}
footer .hearts span{display:inline-block;animation:sp 3s ease-in-out infinite}
@media(max-width:700px){
  header{padding:66px 18px 26px}.logo{width:132px;height:132px}
  .arrow{width:168px;height:84px;transform:translateX(-32px)}.arrow .cap{font-size:1.3rem}
  .section-title{margin:64px 0 36px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="bg"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div id="stars"></div><div id="doodles"></div>

<header>
  <div class="logo-wrap">
    <div class="halo"></div><div class="orbit" id="orbit"></div>
    <img class="logo" src="assets/logo.png" alt="RePic">
  </div>
  <h1>RePic</h1>
  <p class="tagline">Сообщество, где рождаются промты для ИИ-картинок ✧ референсы наших персон-креаторов</p>

  <div class="tg-zone">
    <div class="arrow">
      <span class="cap">тык! ♡</span>
      <svg viewBox="0 0 210 100">
        <path class="draw body-line" d="M14 16 C58 8, 116 22, 143 70"/>
        <path class="draw tip" d="M124 60 L146 76 L152 50"/>
      </svg>
    </div>
    <a class="tg-btn" href="https://t.me/repicprompts" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M9.8 16.3l-.4 4.6c.6 0 .8-.2 1.1-.5l2.6-2.5 5.4 4c1 .5 1.7.3 2-.9l3.5-16.5c.3-1.4-.5-2-1.5-1.6L1.3 9.6C-.1 10.1 0 11 1.1 11.3l5.5 1.7L19.4 5.4c.6-.4 1.2-.2.7.2z"/></svg>
      Наш Telegram-канал
    </a>
  </div>
</header>

<h2 class="section-title"><i>✧</i> Наши креаторы <i>✧</i></h2>
<div class="grid" id="grid"></div>

<footer>
  <div class="hearts"><span>♡</span><span style="animation-delay:.4s">✦</span><span style="animation-delay:.8s">♡</span></div>
  Сделано с любовью для сообщества <a href="https://t.me/repicprompts" target="_blank" rel="noopener">RePic</a>
  <div class="by">Сделано с любовью от <a href="https://t.me/sloppyhouse" target="_blank" rel="noopener">Sloppy</a></div>
  © 2026 RePic · промты, референсы и немного магии
</footer>

<script>
/* ── звёзды ── */
const cols=['#ffb3e6','#b9e4ff','#d9b8ff','#fff0a8','#a8ffe8','#ffc9de'];
const sky=document.getElementById('stars');
for(let i=0;i<150;i++){const s=document.createElement('div');s.className='star';
 const z=Math.random()*2.4+.7;
 s.style.cssText=`width:${z}px;height:${z}px;left:${Math.random()*100}%;top:${Math.random()*100}%;`+
  `animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s;`+
  `background:${['#fff','#ffd6f5','#b9e4ff','#e3d0ff'][i%4]}`;
 sky.appendChild(s);}

/* ── летящие рисованные символы ── */
const S='stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="2.6"';
const shapes=[
 /* сердечко */
 `<svg viewBox="0 0 32 30"><path ${S} d="M16 27C16 27 3 19 3 10.5 3 6.4 6.1 3.4 9.8 3.4c2.7 0 4.9 1.6 6.2 3.8 1.3-2.2 3.5-3.8 6.2-3.8 3.7 0 6.8 3 6.8 7.1C29 19 16 27 16 27z"/></svg>`,
 /* пятиконечная звезда */
 `<svg viewBox="0 0 32 31"><path ${S} d="M16 3l4 8.4 9.2 1.3-6.6 6.5 1.6 9.1L16 24l-8.2 4.3 1.6-9.1-6.6-6.5 9.2-1.3z"/></svg>`,
 /* четырёхлучевая звезда (как в логотипе) */
 `<svg viewBox="0 0 30 30"><path ${S} d="M15 2c1.2 7.3 5.7 11.8 13 13-7.3 1.2-11.8 5.7-13 13-1.2-7.3-5.7-11.8-13-13 7.3-1.2 11.8-5.7 13-13z"/></svg>`,
 /* цветочек с пятью лепестками */
 `<svg viewBox="0 0 32 32"><circle ${S} cx="16" cy="6.5" r="4.4"/><circle ${S} cx="26" cy="13.6" r="4.4"/><circle ${S} cx="22.2" cy="25.2" r="4.4"/><circle ${S} cx="9.8" cy="25.2" r="4.4"/><circle ${S} cx="6" cy="13.6" r="4.4"/><circle ${S} cx="16" cy="16.5" r="3"/></svg>`,
 /* бантик */
 `<svg viewBox="0 0 36 24"><path ${S} d="M18 12C13.6 6.6 8.4 3.8 5.4 5.6 2.6 7.3 2.8 15 5.8 17.2c2.9 2.1 8-1 12.2-5.2z"/><path ${S} d="M18 12c4.4-5.4 9.6-8.2 12.6-6.4 2.8 1.7 2.6 9.4-.4 11.6-2.9 2.1-8-1-12.2-5.2z"/><circle ${S} cx="18" cy="12" r="2.6"/></svg>`,
 /* облачко */
 `<svg viewBox="0 0 38 24"><path ${S} d="M10 21h19c4.1 0 6.4-2.8 6.4-6S33 8.6 29.2 8.6C28.4 4.6 25 2 21 2c-4.2 0-7.6 2.9-8.3 6.9C8.4 9.2 5.4 11.8 5.4 15.4 5.4 18.8 7.3 21 10 21z"/></svg>`,
 /* месяц */
 `<svg viewBox="0 0 28 28"><path ${S} d="M22.5 17.4A10.6 10.6 0 0 1 9.4 4.2a11 11 0 1 0 13.1 13.2z"/></svg>`,
 /* конфетка-леденец */
 `<svg viewBox="0 0 32 22"><circle ${S} cx="16" cy="11" r="6.4"/><path ${S} d="M9.8 8.6 3 4.5v13l6.8-4.1M22.2 8.6 29 4.5v13l-6.8-4.1"/></svg>`
];
const dz=document.getElementById('doodles');
function spawnDoodle(seed){
  const d=document.createElement('div');d.className='doodle';
  const size=Math.random()*22+22,dur=Math.random()*14+26;
  d.innerHTML=shapes[Math.floor(Math.random()*shapes.length)];
  const svg=d.firstChild;svg.setAttribute('width',size);svg.setAttribute('height',size);
  svg.querySelectorAll('path,circle').forEach(p=>p.setAttribute('stroke',cols[Math.floor(Math.random()*cols.length)]));
  d.style.cssText=`left:${Math.random()*96}%;top:${seed?Math.random()*120:105}%;`+
   `--spin:${(Math.random()*2-1)*260}deg;--sw:${(Math.random()*2-1)*40}px;`+
   `animation:floatUp ${dur}s linear ${seed?-Math.random()*dur:0}s infinite, sway ${dur/3}s ease-in-out infinite;`+
   `filter:drop-shadow(0 0 8px rgba(255,180,255,.55))`;
  dz.appendChild(d);setTimeout(()=>d.remove(),(dur+2)*1000);
}
for(let i=0;i<26;i++)spawnDoodle(true);
setInterval(()=>spawnDoodle(false),1900);

/* орбита у логотипа */
const orb=document.getElementById('orbit');
['♡','✦','♡','✧'].forEach((ch,i)=>{const e=document.createElement('div');e.textContent=ch;
 e.style.cssText=`position:absolute;font-size:20px;color:${cols[i]};left:50%;top:50%;`+
  `transform:rotate(${i*90}deg) translateY(-118px);text-shadow:0 0 12px currentColor`;
 orb.appendChild(e);});

/* длина линий стрелки для эффекта отрисовки */
document.querySelectorAll('.arrow .draw').forEach(p=>{
  p.style.setProperty('--len',Math.ceil(p.getTotalLength())+'px');
});

/* ── креаторы (порядок: Вену, Милка, Невлада, Слоппи) ── */
const creators=[
 {c:'Вену',   p:'Женя', f:'zhenya', url:'https://t.me/venuprompts'},
 {c:'Милка',  p:'Милка',f:'milka',  url:'https://t.me/milkagrobgrob'},
 {c:'Невлада',p:'Фаина',f:'faina',  url:'https://t.me/nivladish'},
 {c:'Слоппи', p:'Ева',  f:'eva',    url:'https://t.me/sloppyhouse'}
];
const tg='<svg viewBox="0 0 24 24"><path d="M9.8 16.3l-.4 4.6c.6 0 .8-.2 1.1-.5l2.6-2.5 5.4 4c1 .5 1.7.3 2-.9l3.5-16.5c.3-1.4-.5-2-1.5-1.6L1.3 9.6C-.1 10.1 0 11 1.1 11.3l5.5 1.7L19.4 5.4c.6-.4 1.2-.2.7.2z"/></svg>';
const dl='<svg viewBox="0 0 24 24"><path d="M12 3a1.4 1.4 0 0 1 1.4 1.4v8.7l2.9-2.9a1.4 1.4 0 1 1 2 2l-5.3 5.3a1.4 1.4 0 0 1-2 0L5.7 12.2a1.4 1.4 0 0 1 2-2l2.9 2.9V4.4A1.4 1.4 0 0 1 12 3zM4.4 18.2a1.4 1.4 0 0 1 1.4 1.4h12.4a1.4 1.4 0 1 1 0 2.8H5.8a2.8 2.8 0 0 1-2.8-2.8 1.4 1.4 0 0 1 1.4-1.4z"/></svg>';
/* рисованная от руки рамка */
const frame=`<svg viewBox="0 0 300 420" preserveAspectRatio="none">
 <path class="l1" d="M30 7 C104 4, 197 4, 269 8 C286 9, 294 17, 294 33
   C296 141, 296 281, 293 387 C292 404, 284 412, 267 413
   C181 416, 106 416, 33 412 C16 411, 8 403, 8 386
   C6 278, 6 139, 9 33 C10 16, 15 8, 30 7 Z"/>
 <path class="l2" d="M39 11 C110 8, 192 9, 263 12 C281 13, 289 20, 290 37
   C292 143, 291 279, 289 383 C288 400, 280 408, 262 409
   C178 412, 108 412, 38 408 C20 407, 12 399, 12 382
   C11 275, 11 141, 13 37 C14 20, 22 12, 39 11"/></svg>`;

document.getElementById('grid').innerHTML=creators.map((c,i)=>`
<div class="card" style="transition-delay:${i*110}ms">
 <div class="frame">${frame}</div>
 <div class="card-in">
  <div class="ph"><img src="assets/${c.f}.jpg" alt="${c.p}" loading="lazy"><div class="sheen"><div class="band">
     <span>♡</span><span>✦</span><span>♥</span><span>✧</span><span>♡</span>
     <span>★</span><span>♥</span><span>✦</span><span>♡</span><span>✧</span></div></div></div>
  <div class="body">
   <div class="names">
    <div class="nrow"><span class="lbl">Имя креатора</span><span class="val">${c.c}</span></div>
    <div class="divider"></div>
    <div class="nrow"><span class="lbl">Имя персоны</span><span class="val p">${c.p}</span></div>
   </div>
   <div class="btns">
    <a class="btn dl" href="assets/${c.f}-full.jpg" download="RePic-${c.p}.jpg">${dl} Скачать референс персоны</a>
    <a class="btn tgl" href="${c.url}" target="_blank" rel="noopener">${tg} Telegram креатора</a>
   </div>
  </div>
 </div>
</div>`).join('');

/* появление */
const io=new IntersectionObserver(e=>e.forEach(x=>x.isIntersecting&&x.target.classList.add('in')),{threshold:.12});
document.querySelectorAll('.card').forEach(c=>io.observe(c));

/* 3D-наклон */
document.querySelectorAll('.card').forEach(card=>{
 const inner=card.querySelector('.card-in');
 card.addEventListener('mousemove',e=>{const r=card.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  inner.style.transform=`translateY(-8px) rotateY(${x*8}deg) rotateX(${-y*8}deg)`;});
 card.addEventListener('mouseleave',()=>inner.style.transform='');
});

/* сердечки при скачивании */
document.querySelectorAll('.dl').forEach(b=>b.addEventListener('click',e=>{
 for(let i=0;i<9;i++){const h=document.createElement('div');h.textContent=['♡','✦','✧'][i%3];
  h.style.cssText=`position:fixed;left:${e.clientX}px;top:${e.clientY}px;pointer-events:none;z-index:99;`+
   `font-size:${12+Math.random()*14}px;color:${cols[i%cols.length]};text-shadow:0 0 10px currentColor;`+
   `transition:transform 1s cubic-bezier(.2,.8,.25,1),opacity 1s`;
  document.body.appendChild(h);
  requestAnimationFrame(()=>{h.style.transform=`translate(${(Math.random()-.5)*190}px,${-70-Math.random()*130}px) rotate(${(Math.random()-.5)*300}deg)`;h.style.opacity=0;});
  setTimeout(()=>h.remove(),1100);}
}));
</script>
</body>
</html>
